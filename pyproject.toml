[project]
name = "hebrew-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IdanOshri98", email = "157810385+IdanOshri98@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.9.0",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "supabase>=2.33.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
hebrew-rag = "hebrew_rag:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
